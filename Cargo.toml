[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
parkourflow-core = { path = "crates/parkourflow-core" }
parkourflow-files = { path = "crates/parkourflow-files" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
